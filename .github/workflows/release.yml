name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.5.0"

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Identify and Verify Produced APK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -type f -name "*${ABI}*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK for $ABI not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi
          
          STANDARDIZED="terminaldev-v0.1.0-${ABI}-release.apk"
          cp "$APK_FILE" "$STANDARDIZED"
          
          SIZE=$(stat -c%s "$STANDARDIZED")
          echo "Built $STANDARDIZED: $SIZE bytes"
          if [ "$SIZE" -gt 6291456 ]; then
            echo "ERROR: APK size $SIZE exceeds 6 MB budget (6291456 bytes)!"
            exit 1
          fi

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          $APKSIGNER verify --verbose --print-certs "$STANDARDIZED" > cert_info.txt
          cat cert_info.txt

          SHA256=$(sha256sum "$STANDARDIZED" | awk '{print $1}')
          echo "$SHA256  $STANDARDIZED" > "${STANDARDIZED}.sha256"

          echo "### APK Build Summary ($ABI)" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`$STANDARDIZED\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $SIZE bytes" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`$SHA256\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat cert_info.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-${{ matrix.abi }}
          path: |
            terminaldev-v0.1.0-${{ matrix.abi }}-release.apk
            terminaldev-v0.1.0-${{ matrix.abi }}-release.apk.sha256

  publish-and-verify-release:
    needs: build-release-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all APK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Assemble Release Assets
        run: |
          mkdir -p release_assets
          find artifacts/ -type f -name "*.apk" -exec cp {} release_assets/ \;
          find artifacts/ -type f -name "*.sha256" -exec cat {} + > release_assets/SHA256SUMS.txt
          cd release_assets
          ls -la
          echo "Verifying SHA-256 checksums:"
          sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG="${TAG_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v0.1.0"
          fi
          
          gh release create "$TAG" release_assets/* \
            --title "TerminalDev $TAG" \
            --notes "TerminalDev $TAG - Initial pre-release supporting arm64-v8a, armeabi-v7a, and x86_64." \
            --prerelease

  verify-release:
    needs: publish-and-verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download and Verify Published Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG="${TAG_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v0.1.0"
          fi
          
          mkdir -p verified_release
          cd verified_release
          gh release download "$TAG" -R "$GITHUB_REPOSITORY"
          ls -la
          
          echo "Verifying checksums of published assets:"
          sha256sum -c SHA256SUMS.txt

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          for apk in *.apk; do
            echo "Verifying signature of $apk:"
            $APKSIGNER verify --verbose "$apk"
          done
          echo "All published release assets verified successfully."
